
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeno AI - Think Without Limits</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:#f5f7ff;font-family:Arial,sans-serif}
header{padding:22px 18px;border-bottom:1px solid #263149;display:flex;align-items:center;gap:12px}
.logo{background:#3677ff;border-radius:13px;padding:12px;font-size:23px;font-weight:bold}
h1{font-size:22px;margin:0}
.tagline{color:#aab6d0;font-size:12px;margin-top:5px}
main{max-width:750px;margin:auto;padding:25px 16px}
.welcome{text-align:center;margin:55px 0 35px}
.welcome h2{font-size:30px;margin-bottom:10px}
.welcome p{color:#aab6d0}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:25px 0}
.chips button{background:#111a2d;color:#dce5ff;border:1px solid #293752;border-radius:20px;padding:11px;cursor:pointer}
#chat{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.msg{padding:14px 16px;border-radius:16px;line-height:1.5;max-width:90%;white-space:pre-wrap}
.user{background:#245ce0;align-self:flex-end}
.bot{background:#121c30;border:1px solid #263650;align-self:flex-start}
form{display:flex;gap:8px;background:#111a2b;border:1px solid #34415c;border-radius:17px;padding:8px;position:sticky;bottom:10px}
input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:white;padding:12px;font-size:16px}
form button{background:#3677ff;color:white;border:0;border-radius:12px;padding:0 18px;font-size:15px;cursor:pointer}
.note{text-align:center;color:#8794ae;font-size:12px;margin:14px}
footer{text-align:center;color:#8794ae;padding:20px;font-size:12px}
</style>
</head>
<body>
<header>
<div class="logo">Z</div>
<div>
<h1>Zeno AI</h1>
<div class="tagline">Think Without Limits.</div>
</div>
</header>
<main>
<section class="welcome" id="welcome">
<h2>Your ideas start here.</h2>
<p>Ask a question. Explore an idea. Learn something new.</p>
<div class="chips">
<button type="button" onclick="suggest('Teach me something interesting')">✨ Teach me</button>
<button type="button" onclick="suggest('Give me a creative website idea')">💡 Get ideas</button>
<button type="button" onclick="suggest('Help me learn coding')">💻 Learn coding</button>
</div>
</section>
<div id="chat" aria-live="polite"></div>
<form id="form">
<input id="message" placeholder="Message Zeno AI..." autocomplete="off" required>
<button type="submit">Send ➤</button>
</form>
<div class="note">Zeno AI demo · Think Without Limits</div>
</main>
<footer>Made with curiosity ✨</footer>
<script>
const form=document.getElementById('form');
const input=document.getElementById('message');
const chat=document.getElementById('chat');
function addMessage(text,who){
const div=document.createElement('div');
div.className='msg '+who;
div.textContent=text;
chat.appendChild(div);
}
function suggest(text){input.value=text;input.focus();}
form.addEventListener('submit',function(e){
e.preventDefault();
const text=input.value.trim();
if(!text)return;
document.getElementById('welcome').style.display='none';
addMessage(text,'user');
input.value='';
let answer='Welcome to Zeno AI! This is the first demo version of your chatbot. I can show this sample response, but I am not connected to a real AI model yet. A secure AI connection can be added later.';
const q=text.toLowerCase();
if(q.includes('hello')||q.includes('hi')) answer='Hello! 👋 Welcome to Zeno AI. How can I help you today? This is a demo chatbot.';
else if(q.includes('name')) answer='I am Zeno AI — Think Without Limits! 🤖';
else if(q.includes('coding')||q.includes('code')) answer='Great choice! 💻 Start with HTML to build webpages, CSS to style them, and JavaScript to make them interactive. This is a demo answer.';
else if(q.includes('interesting')) answer='Here is something interesting: light from the Sun takes about 8 minutes and 20 seconds to reach Earth! ☀️ This is a sample response.';
else if(q.includes('idea')) answer='Try creating a personal portfolio, a study planner, or a simple quiz website. 💡 This is a demo response.';
addMessage(answer,'bot');
});
</script>
</body>
</html>
